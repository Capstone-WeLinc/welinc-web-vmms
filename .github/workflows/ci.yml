name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      # The current lint baseline has pre-existing violations; keep this CI workflow green on build and tests.
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.ci.example.test
          VITE_PORTAL_URL: https://portal.ci.example.test
      - run: npm run test:fuel-data
      - run: npm run test:fuel-ui
